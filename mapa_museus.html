<style>
:root{--bg:#f7f4ee;--fg:#1d1b18;--mut:#6b655c;--acc:#9a4a24;--card:#fff;--line:#e3ddd2}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 16px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;color:var(--mut);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;align-items:center}
.bar select,.bar label{font-size:.9rem}.bar select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.wrap{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 120px);min-height:480px}
#map{height:100%}aside{overflow:auto;border-left:1px solid var(--line);background:var(--card);padding:14px 16px}
aside h2{margin:0 0 4px;font-size:1.1rem}.muted{color:var(--mut);font-size:.85rem}
.m{border-top:1px solid var(--line);padding:10px 0}.m b{display:block}.tag{display:inline-block;font-size:.72rem;padding:1px 6px;border-radius:10px;background:#efe7da;margin:2px 4px 2px 0}
.m a{color:var(--acc);font-size:.85rem;margin-right:10px}.ex{font-size:.85rem;margin:4px 0 0 0;padding-left:16px}
.legend summary{cursor:pointer}.legend{background:#fff;padding:8px 10px;border-radius:6px;font-size:.78rem;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.2)}.legend i{display:inline-block;width:14px;height:10px;margin-right:6px}
.zonas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.zonas span{font-size:.8rem;background:#efe7da;padding:2px 8px;border-radius:10px}
.num{background:transparent;border:0;box-shadow:none;font-size:10px;font-weight:700;color:#1d1b18;padding:0}.num:before{display:none}
.lz h3{font-size:.85rem;margin:10px 0 2px;display:flex;align-items:center;gap:6px}.lz h3 i{width:12px;height:12px;border-radius:2px;display:inline-block}.lz ol{margin:0;padding-left:0;list-style:none;columns:2;font-size:.78rem}.lz li{cursor:pointer;padding:1px 0}.lz li:hover{color:var(--acc)}
.aprox{color:#b35900;font-size:.75rem}
@media(max-width:760px){.wrap{grid-template-columns:1fr;height:auto}#map{height:60vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>

const ZCOR={Centro:'#f2c12e',Norte:'#9fd8c4',Leste:'#e0712b',Sul:'#2f6fc0',Oeste:'#b07cc0'};
const HOJE=new Date().toISOString().slice(0,10);
const CORES={"Museu":"#9a4a24","Centro cultural":"#2f6b8a","Casa de Cultura":"#5b7f2b","Unidade Sesc":"#8a2f6b","Fábrica de Cultura":"#a37b00"};
const cats=[...new Set(MUSEUS.map(m=>m.Categoria).filter(Boolean))];const cs=document.getElementById('cat');cats.forEach(c=>{const o=document.createElement('option');o.textContent=c;cs.appendChild(o)});
const map=L.map('map',{zoomSnap:.5}).setView([-23.6,-46.63],10.5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
function filtrados(){const z=zona.value,c=cs.value,g=document.getElementById('gratis').checked;return MUSEUS.filter(m=>(z==='Todas'||m.zona_oficial===z)&&(c==='Todas'||m.Categoria===c)&&(!g||/gratuito/i.test(m.faixa_preco+' '+m['Gratuidade / ingresso'])))}
function cor(n){return n===0?'#f1ece3':n===1?'#f3d3b8':n<=3?'#e5a173':n<=7?'#c96b3c':'#8c3a17'}
const expoPor={};EXPOS.forEach(e=>{if((!e.data_fim||e.data_fim>=HOJE)&&(!e.data_inicio||e.data_inicio<=HOJE)){(expoPor[e.museu_id]=expoPor[e.museu_id]||[]).push(e)}});
const CAM={};let numeros=L.layerGroup().addTo(map);let camada,pontos=L.layerGroup().addTo(map),legenda;
function fmt(d){return d?d.split('-').reverse().join('/'):''}
function cardMuseu(m){const ex=(expoPor[m.id]||[]).map(e=>`<li>${e.titulo} <span class="muted">(${e.tipo}${e.data_fim?', até '+fmt(e.data_fim):''})</span></li>`).join('');
 const site=m['Site ou e-mail']||'';const href=site.includes('@')?'mailto:'+site:(site?(site.startsWith('http')?site:'https://'+site):'');
 return `<div class="m"><b>${m.Nome}</b><span class="tag">${m.Categoria||''}</span>${m.faixa_preco?`<span class="tag">${m.faixa_preco}</span>`:''}
 <div class="muted">${m['Endereço']||''} · ${m['Bairro / distrito']||''}</div>${m['Horário']?`<div class="muted">${m['Horário']}</div>`:''}
 ${m.coord_aproximada==='sim'?'<div class="aprox">posição aproximada no mapa (centro do distrito)</div>':''}
 ${ex?`<ul class="ex">${ex}</ul>`:'<div class="muted">Programação não cadastrada, consulte o site oficial.</div>'}
 ${href?`<a href="${href}" target="_blank" rel="noopener">Site oficial</a>`:''}<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.Nome+' '+(m['Endereço']||'')+' São Paulo')}" target="_blank" rel="noopener">Como chegar</a></div>`}
function painel(titulo,sub,lista){document.getElementById('side').innerHTML=`<h2>${titulo}</h2><div class="muted">${sub}</div>`+(lista.length?lista.map(cardMuseu).join(''):'<p class="muted">Nenhum lugar com esse filtro.</p>')}
function resumo(lista){const c={};lista.forEach(m=>{if(m.zona_oficial)c[m.zona_oficial]=(c[m.zona_oficial]||0)+1});
 const pd={};lista.forEach(m=>{if(m.distrito_oficial)pd[m.distrito_oficial]=(pd[m.distrito_oficial]||0)+1});const top=Object.entries(pd).sort((a,b)=>b[1]-a[1]).slice(0,8);
 document.getElementById('side').innerHTML=`<h2>${zona.value==='Todas'?'São Paulo':'Zona '+zona.value}</h2><div class="muted">${lista.length} lugares no filtro atual</div><div class="zonas">${Object.entries(c).map(([k,v])=>`<span>${k}: ${v}</span>`).join('')}</div><h3 style="font-size:.95rem">Distritos com mais lugares</h3><ol>${top.map(([d,n])=>`<li>${d}: ${n}</li>`).join('')}</ol><p class="muted">Clique num distrito no mapa ou na lista abaixo.</p><div class="lz">${['Centro','Norte','Leste','Sul','Oeste'].filter(z=>zona.value==='Todas'||z===zona.value).map(z=>`<h3><i style="background:${ZCOR[z]}"></i>Zona ${z}</h3><ol>${DISTRITOS.features.filter(f=>f.properties.zona===z).sort((a,b)=>a.properties.numero-b.properties.numero).map(f=>`<li data-d="${f.properties.distrito}">${String(f.properties.numero).padStart(2,'0')} ${f.properties.distrito} (${pd[f.properties.distrito]||0})</li>`).join('')}</ol>`).join('')}</div>`;
 document.querySelectorAll('.lz li').forEach(li=>li.onclick=()=>{const l=CAM[li.dataset.d];map.fitBounds(l.getBounds(),{maxZoom:14});l.fire('click')})}
function desenhar(){const lista=filtrados();const cont={};lista.forEach(m=>{if(m.distrito_oficial)cont[m.distrito_oficial]=(cont[m.distrito_oficial]||0)+1});
 if(camada)map.removeLayer(camada);
 camada=L.geoJSON(DISTRITOS,{style:f=>{const fora=zona.value!=='Todas'&&f.properties.zona!==zona.value;return{color:'#7a6f60',weight:.8,fillColor:modo.value==='zona'?ZCOR[f.properties.zona]:cor(cont[f.properties.distrito]||0),fillOpacity:fora?.12:(modo.value==='zona'?.6:.75),opacity:fora?.3:1}},
  onEachFeature:(f,l)=>{const n=cont[f.properties.distrito]||0;l.bindTooltip(`${String(f.properties.numero).padStart(2,'0')} ${f.properties.distrito} (${f.properties.zona}): ${n} lugar${n===1?'':'es'}`,{sticky:true});CAM[f.properties.distrito]=l;
   l.on('click',()=>painel(f.properties.distrito,`Zona ${f.properties.zona} · subprefeitura ${f.properties.subprefeitura} · ${n} lugar${n===1?'':'es'}`,lista.filter(m=>m.distrito_oficial===f.properties.distrito)))}}).addTo(map);
 numeros.clearLayers();camada.eachLayer(l=>{const c=l.getBounds().getCenter();const p=l.feature.properties;numeros.addLayer(L.marker(c,{interactive:false,icon:L.divIcon({className:'num',html:String(p.numero).padStart(2,'0'),iconSize:[16,12]})}))});
 pontos.clearLayers();lista.forEach(m=>{if(!m.lat||!m.lng)return;L.circleMarker([+m.lat,+m.lng],{radius:5,color:'#fff',weight:1,fillColor:CORES[m.Categoria]||'#444',fillOpacity:.95}).bindTooltip(m.Nome).on('click',e=>{L.DomEvent.stopPropagation(e);painel(m.Nome,`${m.distrito_oficial||''} · Zona ${m.zona_oficial||''}`,[m])}).addTo(pontos)});
 if(zona.value!=='Todas'){const b=L.geoJSON({type:'FeatureCollection',features:DISTRITOS.features.filter(f=>f.properties.zona===zona.value)}).getBounds();map.fitBounds(b,{padding:[10,10]})}
 resumo(lista)}
legenda=L.control({position:'bottomleft'});legenda.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<details'+(innerWidth>760?' open':'')+'><summary><b>Legenda</b></summary><b>Zonas</b><br>'+Object.entries(ZCOR).map(([k,v])=>`<i style="background:${v}"></i>${k}`).join('<br>')+'<br><b>Lugares por distrito</b> (modo quantidade)<br>'+[[0,'nenhum'],[1,'1'],[2,'2 a 3'],[4,'4 a 7'],[8,'8 ou mais']].map(([n,t])=>`<i style="background:${cor(n)}"></i>${t}`).join('<br>')+'<br><b>Pontos</b><br>'+Object.entries(CORES).map(([k,v])=>`<i style="background:${v};border-radius:50%;width:10px"></i>${k}`).join('<br>')+'</details>';L.DomEvent.disableClickPropagation(d);return d};legenda.addTo(map);
const zona=document.getElementById('zona');const modo=document.getElementById('modo');[zona,cs,document.getElementById('gratis'),modo].forEach(el=>el.onchange=desenhar);
desenhar();map.fitBounds(camada.getBounds(),{padding:[10,10]});
</script></body></html>
